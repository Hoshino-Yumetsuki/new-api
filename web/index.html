<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />

    <!-- Primary Meta Tags -->
    <title>New API</title>
    <meta name="title" content="New API" />
    <meta
      name="description"
      content="Unified AI API gateway and admin dashboard."
    />

    <meta name="theme-color" content="#fff" />
    <script>
      (() => {
        try {
          const storedTheme = document.cookie.match(
            /(?:^|;\s*)vite-ui-theme=([^;]*)/
          )?.[1]
          const theme = ['dark', 'light', 'system'].includes(storedTheme ?? '')
            ? storedTheme
            : 'system'
          const resolvedTheme =
            theme === 'system'
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : theme
          document.documentElement.classList.add(resolvedTheme)
        } catch {
          document.documentElement.classList.add('light')
        }
      })()
    </script>

    <!--umami-->
    <!--Google Analytics-->
  </head>

  <body>
    <div id="root" translate="no" class="notranslate"></div>
  </body>
</html>
